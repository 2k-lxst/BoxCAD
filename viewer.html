<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxCAD Local STL Viewer</title>
    <script src="libs/qwebchannel.js"></script>
    <link rel="stylesheet" href="viewer.css">
</head>

<body>
    <div id="loader-container">
        <div class="loader-content">
            <span class="loader" id="loader-spinner"></span>

            <div id="loader-text">
                <h2>3D workspace not initialized.</h2><hr>

                Click <i>Initialize Project</i> in the parameter dock to begin
            </div>
        </div>
    </div>

    <div id="ui-container">
        <button id="menu-button">≡</button>

        <div id="settings-menu" class="hidden">
            <h3>Viewer Options</h3>

            <div class="control-row">
                <label title="Use the dark/light theme">Theme</label>

                <select id="theme-select">
                    <option value="0x1a1a1a">Dark</option>
                    <option value="0xd9d9d9">Light</option>
                </select>
            </div>

            <div class="control-row">
                <label title="Show/hide the grid">Show Grid</label>

                <input type="checkbox" id="grid-toggle" checked>
            </div>

            <div class="control-row">
                <label title="Show/hide the orientation cube in the bottom right corner">Show Orientation Helper Cube</label>

                <input type="checkbox" id="helper-toggle" checked>
            </div>

            <div class="control-row">
                <label title="automatically repositions camera when dimensions change">Show Dimensions</label>

                <input type="checkbox" id="dimensions-toggle" checked>
            </div>

            <div class="control-row">
                <label>Auto Fit View</label>

                <input type="checkbox" id="auto-fit-view-toggle">
            </div>

            <button id="reset-cam">Reset Camera</button>
        </div>
    </div>

    <div id="render-loader">
        <span class="render-loader-text">●</span> RENDERING...
    </div>

    <script>
        window.showLoader = () => { document.getElementById('render-loader').style.display = 'block'; };
        window.hideLoader = () => { document.getElementById('render-loader').style.display = 'none'; };
    </script>

    <!-- Use the import map to import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://threejs.org/build/three.module.js",
                "three/addons/": "https://threejs.org/examples/jsm/",
                "libs/": "./libs/"
            }
        }
    </script>

    <script type="module" src="./viewer.js"></script>
</body>
</html>
